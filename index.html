<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Pixel Pet - Habit Tamagotchi</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="glass-card">

            <h1 class="glow-text">Pixel Pet</h1>

             <div  class="pet-container">
                <div id="pixel-pet" class="pixel-pet" id="my-robot">
                    <div class="eyes"></div>
                </div>
             </div>


             <div class="status-bars">
                <div class="bar-cointainer">
                    <span>XP &#11088;</span>
                    <div class="bar"><div class="progess" id="xp-bar" style="width: 20%";></div></div>
                </div>
                <div class="bar-cointainer" >
                    <span >Health &#128154;</span>
                    <div class="bar"><div class="progess" id="health-bar" style="width: 80%;"></div></div>
                </div>
             </div>
                
             <div class="input-section">
                <input type="text" id="task-input" placeholder="Enter a habit or task...">
                <button id="add-btn" style="position:relative ;z-index: 999; " onclick="addTask()">Add Task</button>
             </div>

             <ul id="task-list"></ul>

             </div>
             <script src="script.js"></script>
    </body>
</html>
